# Plantilla, NO un secreto de verdad. El token es el de un tenant del
# frontal (ver el README de kindling-sandbox); no lo pongas en git.
#
#   kubectl create secret generic kindling-operator-frontal \
#     --namespace kindling-system \
#     --from-literal=token='<token del tenant>'
apiVersion: v1
kind: Secret
metadata:
  name: kindling-operator-frontal
  namespace: kindling-system
type: Opaque
stringData:
  token: CHANGE-ME
