name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: vet, fmt y test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then
            echo "estos ficheros no están formateados:" >&2
            echo "$out" >&2
            gofmt -d $out >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race no es opcional: el frontal relé de shell y el fondo de
      # precalentadas trabajan desde varias goroutines sobre el mismo estado.
      - name: go test -race
        run: go test -race ./...

      - name: cross-compile
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/kling-sandbox
          GOOS=linux  GOARCH=amd64 go build -o /dev/null ./cmd/kling-sandbox
          GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/kling-sandbox
